---
layout: default
title: Blog
---
<h1 class="page-title">Blog</h1>
{% if site.posts.size == 0 %}<p class="muted">No posts yet.</p>{% endif %}
<ul class="post-list">
  {% for post in site.posts %}
    <li>
      <span class="news-date">{{ post.date | date: "%Y.%m.%d" }}</span>
      <a href="{{ post.url | relative_url }}">{{ post.title }}</a>
    </li>
  {% endfor %}
</ul>
