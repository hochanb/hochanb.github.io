# CV 전용 데이터 — 사이트(_config.yml, _data/*.yml)와 독립적으로 관리합니다.
# 빌드: .venv/bin/python cv/build_cv.py  ->  assets/cv.pdf
# 전화번호처럼 공개 저장소에 올리면 안 되는 값은 cv/private.yml 에 (git에 안 올라감).
# 값에 ": " (콜론+공백)이 들어가면 따옴표로 감싸기.
# summary / note 에서는 **굵게**, *기울임*, [링크](url) 사용 가능.
# 섹션을 통째로 빼려면 해당 키를 지우거나 주석 처리.

profile:
  name: Hochan Bang              # 논문 저자 목록에서 굵게 표시될 이름
  # name_ko: 방호찬
  title: M.S. Student
  lab: Biointelligence Lab
  lab_url: https://bi.snu.ac.kr/
  affiliation: Department of Computer Science and Engineering, Seoul National University
  affiliation_url: https://cse.snu.ac.kr/en
  photo: assets/img/profile.jpg  # 프로젝트 루트 기준 경로
  qr: https://hochanb.github.io  # 우상단 QR 코드가 연결될 주소 (지우면 QR 없음)
  email: hochan0115@snu.ac.kr
  # phone 은 cv/private.yml 에
  links:                         # 표시 순서대로. 지원: github, linkedin, scholar, website
    website: https://hochanb.github.io
    linkedin: https://www.linkedin.com/in/hochan-bang/

summary: >-
  M.S. student at **Seoul National University**, advised by **Prof. Byoung-Tak Zhang**.
  My research focuses on **Reinforcement Learning** and **Robotics**,
  with a particular interest in learning effective skill representations and dexterous hand manipulation.

